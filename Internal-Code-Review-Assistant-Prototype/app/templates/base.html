<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}CodeReview Assistant{% endblock %}</title>
<link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}"></head>
<body><header><a class="brand" href="{{ url_for('review.index') }}">CodeReview Assistant</a><nav><a href="{{ url_for('review.index') }}">New review</a><a href="{{ url_for('review.history') }}">History</a></nav></header>
<main>{% with messages = get_flashed_messages(with_categories=true) %}{% for category, message in messages %}<div class="flash {{ category }}">{{ message }}</div>{% endfor %}{% endwith %}
{% block content %}{% endblock %}</main><footer>Case Study 72 · Advisory prototype · Human review required</footer></body></html>
